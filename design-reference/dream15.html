document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

px,5.6vw,74px);line-height:.96;letter-spacing:.5px;color:#F0EDE8;max-width:18ch\">No es un viaje cualquiera. Es <em style=\"font-style:normal;background:linear-gradient(110deg,#F472B6,#E84393 55%,#F5C842);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#E07AC4\">el<\u002Fem> viaje.<\u002Fh2>\n    <p style=\"margin-top:24px;max-width:620px;font-size:16px;font-weight:300;line-height:1.75;color:rgba(240,237,232,.82)\">El escenario es Orlando: Disney, Universal, los parques y todos los personajes que viste desde siempre. Vos viajás, la vivís y posás para la foto. Lo demás lo armo yo, pieza por pieza.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:14px;margin-top:48px\">\n      <div style=\"background:#1C0B1A;border:1px solid rgba(240,237,232,.08);border-radius:18px;padding:30px 26px;transition:transform .25s,border-color .25s\" style-hover=\"transform:translateY(-4px);border-color:rgba(232,121,200,.35)\">\n        <div style=\"width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,rgba(232,67,147,.3),rgba(232,67,147,.22));display:flex;align-items:center;justify-content:center;color:#E07AC4;margin-bottom:20px\"><svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.962 0z\"><\u002Fpath><path d=\"M20 3v4M22 5h-4M4 17v2M5 18H3\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3 style=\"font-size:17px;font-weight:700;color:#F0EDE8;margin-bottom:8px\">Disney &amp; Universal<\u002Fh3>\n        <p style=\"font-size:14px;font-weight:300;line-height:1.6;color:rgba(240,237,232,.82)\">Los parques completos, los shows, los castillos y cada personaje. El escenario más mágico del mundo.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#1C0B1A;border:1px solid rgba(240,237,232,.08);border-radius:18px;padding:30px 26px;transition:transform .25s,border-color .25s\" style-hover=\"transform:translateY(-4px);border-color:rgba(232,121,200,.35)\">\n        <div style=\"width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,rgba(232,67,147,.3),rgba(232,67,147,.22));display:flex;align-items:center;justify-content:center;color:#E07AC4;margin-bottom:20px\"><svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z\"><\u002Fpath><path d=\"M13 5v2M13 17v2M13 11v2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3 style=\"font-size:17px;font-weight:700;color:#F0EDE8;margin-bottom:8px\">Entradas y reservas<\u002Fh3>\n        <p style=\"font-size:14px;font-weight:300;line-height:1.6;color:rgba(240,237,232,.82)\">Entradas, reservas especiales y los lugares que hay que vivir, ya resueltos. Sin filas eternas, sin perderte nada.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#1C0B1A;border:1px solid rgba(240,237,232,.08);border-radius:18px;padding:30px 26px;transition:transform .25s,border-color .25s\" style-hover=\"transform:translateY(-4px);border-color:rgba(232,121,200,.35)\">\n        <div style=\"width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,rgba(232,67,147,.3),rgba(232,67,147,.22));display:flex;align-items:center;justify-content:center;color:#E07AC4;margin-bottom:20px\"><svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V u002Fdiv>\n    <h2 style=\"font-family:'SkatynGator',serif;font-weight:400;font-size:clamp(38px,5.6vw,74px);line-height:.96;letter-spacing:.5px;color:#F0EDE8;max-width:18ch\"><span style=\"font-size: clamp(38px, 5.4vw, 72px);\">Ellos viven la aventura. Vos te quedás <\u002Fspan><em style=\"font-style: normal; background: linear-gradient(110deg, rgb(244, 114, 182), rgb(232, 67, 147) 55%, rgb(245, 200, 66)) text; -webkit-text-fill-color: transparent; color: rgb(224, 122, 196);\">tranquilo<\u002Fem>.<\u002Fh2>\n    <p style=\"margin-top:24px;max-width:600px;font-size:16px;font-weight:300;line-height:1.75;color:rgba(240,237,232,.82)\">Detrás de la magia hay un agente de viajes certificado y una operación seria. No es un grupo improvisado: es un viaje organizado de principio a fin, con alguien del otro lado disponible antes, durante y después.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:48px\">\n      <div style=\"background:rgba(18,8,24,.55);border:1px solid rgba(240,237,232,.08);border-radius:18px;padding:28px 26px;flex:0 0 calc(25% - 10.5px);min-width:220px\">\n        <div style=\"width:46px;height:46px;border-radius:13px;background:rgba(66,194,194,.12);display:flex;align-items:center;justify-content:center;color:#42C2C2;margin-bottom:18px\"><svg viewBox=\"0 0 24 24\" width=\"23\" height=\"23\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3 style=\"font-size:16px;font-weight:700;color:#F0EDE8;margin-bottom:8px\">Agente certificado<\u002Fh3>\n        <p style=\"font-size:13.5px;font-weight:300;line-height:1.6;color:rgba(240,237,232,.82)\">Certificación oficial Disney (College of Disney Knowledge) y Universal (Preferred Travel Agent), bajo Team Livi Travel. Real y verificable.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(18,8,24,.55);border:1px solid rgba(240,237,232,.08);border-radius:18px;padding:28px 26px;flex:0 0 calc(25% - 10.5px);min-width:220px\">\n        <div style=\"width:46px;height:46px;border-radius:13px;background:rgba(66,194,194,.12);display:flex;align-items:center;justify-content:center;color:#42C2C2;margin-bottom:18px\"><svg viewBox=\"0 0 24 24\" width=\"23\" height=\"23\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3 style=\"font-size:16px;font-weight:700;color:#F0EDE8;margin-bottom:8px\">Grupo reducido y acompañado<\u002Fh3>\n        <p style=\"font-size:13.5px;font-weight:300;line-height:1.6;color:rgba(240,237,232,.82)\">Un coordinador y una coordinadora cada 10 chicos y chicas, las 24 horas. Grupos más chicos que el promedio: atención real, no masa.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(18,8,24,.55);border:1px solid rgba(240,237,232,.08);border-radius:18px;padding:28px 26px;flex:0 0 calc(25% - 10.5px);min-width:220px\">\n        <div style=\"width:46px;height:46px;border-radius:13px;background:rgba(66,194,194,.12);display:flex;align-items:center;justify-content:center;color:#42C2C2;margin-bottom:18px\"><svg viewBox=\"0 0 24 24\" width=\"23\" height=\"23\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\u002Fpath><path d=\"M9 12h6\"><\u002Fpath><path d=\"M12 9v6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3 style=\"font-size:16px;font-weight:700;color:#F0EDE8;margin-bottom:8px\">Seguridad médica en capas<\u002Fh3>\n        <p style=\"font-size:13.5px;font-weight:300;line-height:1.6;color:rgba(240,237,232,.82)\">Asistencia al viajero PAX con cobertura internacional, respaldo médico en destino y ficha médica de cada viajero. La salud, cubierta de punta a punta.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(18,8,24,.55);border:1px solid rgba(240,237,232,.08);border-radius:18px;padding:28px 26px;flex:0 0 calc(25% - 10.5px);min-width:220px\">\n        <div style=\"width:46px;height:46px;border-radius:13px;background:rgba(66,194,194,.12);display:flex;align-items:center;justify-content:center;color:#42C2C2;margin-bottom:18px\"><svg viewBox=\"0 0 24 24\" width=\"23\" height=\"23\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m22 8-6 4 6 4V8z\"><\u002Fpath><rect width=\"14\" height=\"12\" x=\"2\" y=\"6\" rx=\"2\" ry=\"2\"><\u002Frect><\u002Fsvg><\u002Fdiv>\n        <h3 style=\"font-size:16px;font-weight:700;color:#F0EDE8;margin-bottom:8px\">Seguimiento diario<\u002Fh3>\n        <p style=\"font-size:13.5px;font-weight:300;line-height:1.6;color:rgba(240,237,232,.82)\">Fotos y video del grupo todos los días. Ves a tu hijo o hija disfrutando en cada jornada del viaje.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(18,8,24,.55);border:1px solid rgba(240,237,232,.08);border-radius:18px;padding:28px 26px;flex:0 0 calc(25% - 10.5px);min-width:220px\">\n        <div style=\"width:46px;height:46px;border-radius:13px;background:rgba(66,194,194,.12);display:flex;align-items:center;justify-content:center;color:#42C2C2;margin-bottom:18px\"><svg viewBox=\"0 0 24 24\" width=\"23\" height=\"23\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3 style=\"font-size:16px;font-weight:700;color:#F0EDE8;margin-bottom:8px\">Todo organizado<\u002Fh3>\n        <p style=\"font-size:13.5px;font-weight:300;line-height:1.6;color:rgba(240,237,232,.82)\">Vuelos, hotel, traslados, entradas y cada detalle, resueltos y por escrito. Nada librado al azar.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(18,8,24,.55);border:1px solid rgba(240,237,232,.08);border-radius:18px;padding:28px 26px;flex:0 0 calc(25% - 10.5px);min-width:220px\">\n        <div style=\"width:46px;height:46px;border-radius:13px;background:rgba(66,194,194,.12);display:flex;align-items:center;justify-content:center;color:#42C2C2;margin-bottom:18px\"><svg viewBox=\"0 0 24 24\" width=\"23\" height=\"23\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3 style=\"font-size:16px;font-weight:700;color:#F0EDE8;margin-bottom:8px\">Siempre disponible<\u002Fh3>\n        <p style=\"font-size:13.5px;font-weight:300;line-height:1.6;color:rgba(240,237,232,.82)\">Una persona real del otro lado. Antes, durante y después del viaje. Comunicación directa con las familias.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(18,8,24,.55);border:1px solid rgba(240,237,232,.08);border-radius:18px;padding:28px 26px;flex:0 0 calc(25% - 10.5px);min-width:220px\">\n        <div style=\"width:46px;height:46px;border-radius:13px;background:rgba(66,194,194,.12);display:flex;align-items:center;justify-content:center;color:#42C2C2;margin-bottom:18px\"><svg viewBox=\"0 0 24 24\" width=\"23\" height=\"23\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z\"><\u002Fpath><polyline points=\"14 2 14 8 20 8\"><\u002Fpolyline><line x1=\"16\" y1=\"13\" x2=\"8\" y2=\"13\"><\u002Fline><line x1=\"16\" y1=\"17\" x2=\"8\" y2=\"17\"><\u002Fline><\u002Fsvg><\u002Fdiv>\n        <h3 style=\"font-size:16px;font-weight:700;color:#F0EDE8;margin-bottom:8px\">Visa y documentación<\u002Fh3>\n        <p style=\"font-size:13.5px;font-weight:300;line-height:1.6;color:rgba(240,237,232,.82)\">Te asistimos con el trámite de visa o ESTA y con el permiso de viaje para menores. La documentación migratoria, acompañada de principio a fin.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:42px;display:flex;flex-direction:column;align-items:center;gap:18px\">\n      <span style=\"font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(240,237,232,.55)\">Trabajo junto a<\u002Fspan>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:clamp(48px,6vw,80px)\">\n        <img src=\"fa5c4b22-627a-474f-9726-48dc4331aa29\" alt=\"Walt Disney World\" style=\"height:40px;width:auto;opacity:.65;filter:brightness(0) invert(1)\">\n        <img src=\"8ad9c7b3-1361-4b1b-abe5-6b0ee4e3a601\" alt=\"Universal Orlando\" style=\"height:36px;width:auto;opacity:.65;filter:brightness(0) invert(1)\">\n        <img src=\"5615f5ef-9a0b-45d0-b047-7ffbecebf335\" alt=\"PAX Asistencia al Viajero\" style=\"height:34px;width:auto;opacity:.65;filter:brightness(0) invert(1)\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"testimonios\" data-screen-label=\"Testimonios\" style=\"background:#1C0B1A;padding:clamp(72px,10vw,128px) 0;border-top:1px solid rgba(240,237,232,.06);border-bottom:1px solid rgba(240,237,232,.06)\">\n  <div style=\"width:min(1080px,calc(100% - 48px));margin:0 auto\">\n    <div style=\"displ :#F5C842\">Acá sí.<\u002Fem><\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:14px;margin-top:48px\">\n      <div style=\"position:relative;background:linear-gradient(160deg,rgba(232,67,147,.16),rgba(22,8,20,.6));border:1px solid rgba(232,121,200,.2);border-radius:18px;padding:30px 26px;overflow:hidden\">\n        <span style=\"position:absolute;top:18px;right:22px;font-family:'SkatynGator',serif;font-size:42px;color:rgba(240,237,232,.07)\">01<\u002Fspan>\n        <div style=\"width:46px;height:46px;border-radius:13px;background:rgba(232,67,147,.16);display:flex;align-items:center;justify-content:center;color:#E07AC4;margin-bottom:18px\"><svg viewBox=\"0 0 24 24\" width=\"23\" height=\"23\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1\"><\u002Fpath><path d=\"M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3 style=\"font-size:16px;font-weight:700;color:#F0EDE8;margin-bottom:8px\">Reservás tu lugar<\u002Fh3>\n        <p style=\"font-size:13.5px;font-weight:300;line-height:1.6;color:rgba(240,237,232,.82)\">Asegurás el cupo en el grupo desde el día uno, al precio de hoy.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"position:relative;background:linear-gradient(160deg,rgba(232,67,147,.16),rgba(22,8,20,.6));border:1px solid rgba(232,121,200,.2);border-radius:18px;padding:30px 26px;overflow:hidden\">\n        <span style=\"position:absolute;top:18px;right:22px;font-family:'SkatynGator',serif;font-size:42px;color:rgba(240,237,232,.07)\">02<\u002Fspan>\n        <div style=\"width:46px;height:46px;border-radius:13px;background:rgba(232,67,147,.16);display:flex;align-items:center;justify-content:center;color:#E07AC4;margin-bottom:18px\"><svg viewBox=\"0 0 24 24\" width=\"23\" height=\"23\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 2v4M16 2v4\"><\u002Fpath><rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"><\u002Frect><path d=\"M3 10h18\"><\u002Fpath><path d=\"m9 16 2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3 style=\"font-size:16px;font-weight:700;color:#F0EDE8;margin-bottom:8px\">Pagás en cuotas<\u002Fh3>\n        <p style=\"font-size:13.5px;font-weight:300;line-height:1.6;color:rgba(240,237,232,.82)\">Armás un plan mensual a tu medida. El viaje deja de ser un golpe y pasa a ser un plan.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"position:relative;background:linear-gradient(160deg,rgba(232,67,147,.16),rgba(22,8,20,.6));border:1px solid rgba(232,121,200,.2);border-radius:18px;padding:30px 26px;overflow:hidden\">\n        <span style=\"position:absolute;top:18px;right:22px;font-family:'SkatynGator',serif;font-size:42px;color:rgba(240,237,232,.07)\">03<\u002Fspan>\n        <div style=\"width:46px;height:46px;border-radius:13px;background:rgba(232,67,147,.16);display:flex;align-items:center;justify-content:center;color:#E07AC4;margin-bottom:18px\"><svg viewBox=\"0 0 24 24\" width=\"23\" height=\"23\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3 style=\"font-size:16px;font-weight:700;color:#F0EDE8;margin-bottom:8px\">Cuidás el precio<\u002Fh3>\n        <p style=\"font-size:13.5px;font-weight:300;line-height:1.6;color:rgba(240,237,232,.82)\">Anclás temprano y te cubrís de los aumentos. Empezar antes siempre juega a favor de tu bolsillo.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"position:relative;background:linear-gradient(160deg,rgba(232,67,147,.16),rgba(22,8,20,.6));border:1px solid rgba(232,121,200,.2);border-radius:18px;padding:30px 26px;overflow:hidden\">\n        <span style=\"position:absolute;top:18px;right:22px;font-family:'SkatynGator',serif;font-size:42px;color:rgba(240,237,232,.07)\">04<\u002Fspan>\n        <div style=\"width:46px;height:46px;border-radius:13px;background:rgba(232,67,147,.16);display:flex;align-items:center;justify-content:center;color:#E07AC4;margin-bottom:18px\"><svg viewBox=\"0 0 24 24\" width=\"23\" height=\"23\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 1.5c.4 5.2 5.3 10.1 10.5 10.5C17.3 12.4 12.4 17.3 12 22.5 11.6 17.3 6.7 12.4 1.5 12 6.7 11.6 11.6 6.7 12 1.5Z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3 style=\"font-size:16px;font-weight:700;color:#F0EDE8;margin-bottom:8px\">Viajás con todo pago<\u002Fh3>\n        <p style=\"font-size:13.5px;font-weight:300;line-height:1.6;color:rgba(240,237,232,.82)\">Cuando llega la fecha, el viaje ya está saldado. Solo te queda disfrutar.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:34px;display:flex;flex-wrap:wrap;align-items:center;gap:16px\"><a href=\"#form\" style=\"text-decoration:none;font-size:14px;font-weight:700;color:#fff;padding:16px 30px;border-radius:999px;background:linear-gradient(120deg,#F472B6 0%,#E84393 50%,#F5C842 100%);box-shadow:0 14px 34px -10px rgba(196,62,138,.8);transition:transform .18s,box-shadow .2s;display:inline-flex;align-items:center;gap:9px\" style-hover=\"transform:translateY(-2px);box-shadow:0 18px 40px -10px rgba(196,62,138,.95)\">Sumate al Club<svg viewBox=\"0 0 24 24\" width=\"17\" height=\"17\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M12 5l7 7-7 7\"><\u002Fpath><\u002Fsvg><\u002Fa><span style=\"display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:999px;background:rgba(245,200,66,.07);border:1px solid rgba(245,200,66,.22);font-size:11.5px;font-weight:600;letter-spacing:.4px;color:rgba(245,200,66,.82)\"><svg viewBox=\"0 0 24 24\" width=\"11\" height=\"11\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"12\"><\u002Fline><line x1=\"12\" y1=\"16\" x2=\"12.01\" y2=\"16\"><\u002Fline><\u002Fsvg>Cupos limitados por grupo<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"faq\" data-screen-label=\"FAQ\" style=\"background:#1C0B1A;padding:clamp(72px,10vw,128px) 0;border-top:1px solid rgba(240,237,232,.06);border-bottom:1px solid rgba(240,237,232,.06)\">\n  <div style=\"width:min(880px,calc(100% - 48px));margin:0 auto\">\n    <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:22px\"><span style=\"width:30px;height:1.5px;background:#F5C842\"><\u002Fspan><span style=\"font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#F5C842\">Preguntas frecuentes<\u002Fspan><\u002Fdiv>\n    <h2 style=\"font-family:'SkatynGator',serif;font-weight:400;font-size:clamp(34px,4.8vw,62px);line-height:.96;letter-spacing:.5px;color:#F0EDE8;margin-bottom:40px\">Lo que más nos <em style=\"font-style:normal;background:linear-gradient(110deg,#F472B6,#E84393 55%,#F5C842);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#E07AC4\">preguntan<\u002Fem>.<\u002Fh2>\n    <div>\n      <div style=\"border-bottom:1px solid rgba(240,237,232,.08)\">\n        <button onclick=\"{{ toggleFaq0 }}\" style=\"width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:22px 0;display:flex;align-items:center;justify-content:space-between;gap:16px\"><span style=\"font-size:16.5px;font-weight:600;color:#F0EDE8;line-height:1.35\">¿Qué incluye el viaje?<\u002Fspan><span style=\"flex-shrink:0;font-size:22px;font-weight:300;color:#E07AC4;line-height:1;min-width:20px;text-align:center\">{{ faq0Ind }}<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ faq0Open }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:0 0 22px;font-size:15px;font-weight:300;line-height:1.75;color:rgba(240,237,232,.82)\">Todo lo importante, ya resuelto: vuelos, hoteles, entradas a los parques de Disney y a Universal con Park to Park, Memory Maker, comidas, traslados, días de compras, 2 noches en Miami, una cena especial de bienvenida, tu kit de viaje, seguimiento diario, asistencia al viajero y regalos sorpresa. Salís de casa y el resto ya está pensado.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid rgba(240,237,232,.08)\">\n        <button onclick=\"{{ toggleFaq1 }}\" style=\"width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:22px 0;display:flex;align-items:center;justify-content:space-between;gap:16px\"><span style=\"font-size:16.5px;font-weight:600;color:#F0EDE8;line-height:1.35\">¿Cuánto dura el viaje?<\u002Fspan><span style=\"flex-shrink:0;font-size:22px;font-weight:300;color:#E07AC4;line-height:1;min-width:20px;text-align:center\">{{ faq1Ind }}<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ faq1Open }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:0 0 22px;font-size:15px;font-weight:300;line-height:1.75;color:rgba(240,237,232,.82)\">15 días viviéndolo a pleno, entre Orlando y Miami.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid rgba(240,237,232,.08)\">\n        <button onclick=\"{{ toggleFaq2 }}\" style=\"width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:22px 0;display:flex;align-items:center;justify-content:space-between;gap:16px\"><span style=\"font-size:16.5px;font-weight:600;color:#F0EDE8;line-height:1.35\">¿Qué edad tienen que tener?<\u002Fspan><span style=\"flex-shrink:0;font-size:22px;font-weight:300;color:#E07AC4;line-height:1;min-width:20px;text-align:center\">{{ faq2Ind }}<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ faq2Open }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:0 0 22px;font-size:15px;font-weight:300;line-height:1.75;color:rgba(240,237,232,.82)\">Es para chicos y chicas de 14 a 16 años que cumplen (o cumplieron) sus 15.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid rgba(240,237,232,.08)\">\n        <button onclick=\"{{ toggleFaq3 }}\" style=\"width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:22px 0;display:flex;align-items:center;justify-content:space-between;gap:16px\"><span style=\"font-size:16.5px;font-weight:600;color:#F0EDE8;line-height:1.35\">¿Quiénes acompañan al grupo?<\u002Fspan><span style=\"flex-shrink:0;font-size:22px;font-weight:300;color:#E07AC4;line-height:1;min-width:20px;text-align:center\">{{ faq3Ind }}<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ faq3Open }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:0 0 22px;font-size:15px;font-weight:300;line-height:1.75;color:rgba(240,237,232,.82)\">Un coordinador y una coordinadora cada 10 chicos y chicas (grupos más chicos que el promedio), las 24 horas, con respaldo médico en destino. Atención de verdad, de la mañana a la noche.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid rgba(240,237,232,.08)\">\n        <button onclick=\"{{ toggleFaq4 }}\" style=\"width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:22px 0;display:flex;align-items:center;justify-content:space-between;gap:16px\"><span style=\"font-size:16.5px;font-weight:600;color:#F0EDE8;line-height:1.35\">¿Mi hijo o hija no conoce a nadie, va a estar bien?<\u002Fspan><span style=\"flex-shrink:0;font-size:22px;font-weight:300;color:#E07AC4;line-height:1;min-width:20px;text-align:center\">{{ faq4Ind }}<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ faq4Open }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:0 0 22px;font-size:15px;font-weight:300;line-height:1.75;color:rgba(240,237,232,.82)\">Sí. Antes de viajar hacemos encuentros virtuales de integración (una videollamada de bienvenida y un grupo de WhatsApp del viaje) para que el grupo se conozca. Nadie llega sin conocer a nadie.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid rgba(240,237,232,.08)\">\n        <button onclick=\"{{ toggleFaq5 }}\" style=\"width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:22px 0;display:flex;align-items:center;justify-content:space-between;gap:16px\"><span style=\"font-size:16.5px;font-weight:600;color:#F0EDE8;line-height:1.35\">¿Cómo cuidan la salud y la seguridad?<\u002Fspan><span style=\"flex-shrink:0;font-size:22px;font-weight:300;color:#E07AC4;line-height:1;min-width:20px;text-align:center\">{{ faq5Ind }}<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ faq5Open }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:0 0 22px;font-size:15px;font-weight:300;line-height:1.75;color:rgba(240,237,232,.82)\">En capas: asistencia al viajero PAX con cobertura internacional, respaldo médico en destino, una ficha médica de cada viajero que completás antes de salir, y coordinación las 24 horas con grupos reducidos. La tranquilidad es parte del viaje.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid rgba(240,237,232,.08)\">\n        <button onclick=\"{{ toggleFaq6 }}\" style=\"width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:22px 0;display:flex;align-items:center;justify-content:space-between;gap:16px\"><span style=\"font-size:16.5px;font-weight:600;color:#F0EDE8;line-height:1.35\">¿Necesitan visa para Estados Unidos?<\u002Fspan><span style=\"flex-shrink:0;font-size:22px;font-weight:300;color:#E07AC4;line-height:1;min-width:20px;text-align:center\">{{ faq6Ind }}<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ faq6Open }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:0 0 22px;font-size:15px;font-weight:300;line-height:1.75;color:rgba(240,237,232,.82)\">Sí. Y no te ocupás solo: te asistimos con el trámite de visa o ESTA y con el permiso de viaje para menores. Te guiamos en toda la documentación migratoria.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid rgba(240,237,232,.08)\">\n        <button onclick=\"{{ toggleFaq7 }}\" style=\"width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:22px 0;display:flex;align-items:center;justify-content:space-between;gap:16px\"><span style=\"font-size:16.5px;font-weight:600;color:#F0EDE8;line-height:1.35\">¿Puedo pagar en cuotas?<\u002Fspan><span style=\"flex-shrink:0;font-size:22px;font-weight:300;color:#E07AC4;line-height:1;min-width:20px;text-align:center\">{{ faq7Ind }}<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ faq7Open }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:0 0 22px;font-size:15px;font-weight:300;line-height:1.75;color:rgba(240,237,232,.82)\">Sí. Reservás con una seña y el resto lo pagás en cuotas a tu medida, mes a mes, hasta el viaje. Pagar tu viaje al exterior en cuotas es algo que casi nadie te ofrece.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-bottom:1px solid rgba(240,237,232,.08)\">\n        <button onclick=\"{{ toggleFaq8 }}\" style=\"width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:22px 0;display:flex;align-items:center;justify-content:space-between;gap:16px\"><span style=\"font-size:16.5px;font-weight:600;color:#F0EDE8;line-height:1.35\">¿Y si reservo y después no puedo viajar?<\u002Fspan><span style=\"flex-shrink:0;font-size:22px;font-weight:300;color:#E07AC4;line-height:1;min-width:20px;text-align:center\">{{ faq8Ind }}<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ faq8Open }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:0 0 22px;f
